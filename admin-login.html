<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Undian Spin Khalil Store</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-dharmachakra"></i>
            <span>KHALIL STORE ADMIN</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
        </div>
    </header>

    <main class="main-wrapper">
        <div class="card card-center" style="max-width: 420px;">
            <div class="brand-logo" style="background: linear-gradient(135deg, #0F172A, #2563EB);">
                <i class="fa-solid fa-user-lock"></i>
            </div>
            
            <h1 class="page-title">LOGIN <span>ADMIN</span></h1>
            <p class="subtitle">Masuk untuk mengelola invoice, tiket spin, dan pengaturan hadiah Khalil Store.</p>

            <form id="formAdminLogin" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label for="adminUser" class="form-label">
                        <i class="fa-solid fa-user"></i> Username
                    </label>
                    <input 
                        type="text" 
                        id="adminUser" 
                        class="form-input" 
                        placeholder="Username Admin" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="adminPass" class="form-label">
                        <i class="fa-solid fa-key"></i> Password
                    </label>
                    <input 
                        type="password" 
                        id="adminPass" 
                        class="form-input" 
                        placeholder="Password Admin" 
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Dashboard
                </button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Undian Spin Khalil Store. All Rights Reserved.</p>
    </footer>

    <!-- JS Scripts -->
    <script src="config.js"></script>
    <script>
        // Cek jika sudah login
        if (localStorage.getItem('spin_admin_logged_in') === 'true') {
            window.location.href = 'admin.html';
        }

        function handleAdminLogin(event) {
            event.preventDefault();
            const userVal = document.getElementById('adminUser').value.trim();
            const passVal = document.getElementById('adminPass').value.trim();

            if (userVal === CONFIG.ADMIN_USERNAME && passVal === CONFIG.ADMIN_PASSWORD) {
                localStorage.setItem('spin_admin_logged_in', 'true');
                Swal.fire({
                    icon: 'success',
                    title: 'Login Berhasil!',
                    text: 'Selamat datang di Panel Admin Khalil Store.',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'admin.html';
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Login Gagal',
                    text: 'Username atau Password salah!',
                    confirmColor: '#2563eb'
                });
            }
        }
    </script>
</body>
</html>
