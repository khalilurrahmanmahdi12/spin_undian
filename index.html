<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undian Ditutup</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', Arial, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #1e3a8a);
        color: white;
    }

    .container {
        text-align: center;
        background: rgba(255,255,255,0.1);
        padding: 40px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        width: 90%;
        max-width: 500px;
        box-shadow: 0 20px 40px rgba(0,0,0,.3);
    }

    .icon {
        font-size: 70px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 32px;
        margin-bottom: 15px;
    }

    p {
        font-size: 18px;
        color: #e2e8f0;
        line-height: 1.6;
    }

    .date {
        margin-top: 25px;
        display: inline-block;
        padding: 12px 25px;
        background: #22c55e;
        border-radius: 50px;
        font-weight: bold;
        font-size: 18px;
    }

    .footer {
        margin-top: 25px;
        font-size: 14px;
        color: #cbd5e1;
    }

    .sparkle {
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%,100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.1);
        }
    }
</style>

</head>

<body>

<div class="container">

    <div class="icon sparkle">🎁</div>

    <h1>Undian Telah Ditutup</h1>

    <p>
        Terima kasih sudah ikut berpartisipasi dalam undian kami.
        <br><br>
        Silakan tunggu pengumuman pemenang pada tanggal:
    </p>

    <div class="date">
        📅 7 Agustus 2026
    </div>

    <p style="margin-top:25px;">
        Hadiah menarik sedang menanti untuk para pemenang.
        <br>
        Jangan lewatkan kesempatan berikutnya! ✨
    </p>

    <div class="footer">
        Semoga kamu menjadi salah satu yang beruntung 🤞
    </div>

</div>

</body>
</html>
