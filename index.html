<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Down</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            background:linear-gradient(135deg,#0f172a,#1e293b);
            color:#fff;
        }

        .container{
            text-align:center;
            background:rgba(255,255,255,0.08);
            padding:50px 40px;
            border-radius:20px;
            backdrop-filter:blur(10px);
            box-shadow:0 15px 40px rgba(0,0,0,.3);
            max-width:500px;
            width:90%;
        }

        .icon{
            font-size:70px;
            margin-bottom:20px;
        }

        h1{
            font-size:32px;
            margin-bottom:15px;
        }

        p{
            font-size:18px;
            color:#d1d5db;
            line-height:1.6;
            margin-bottom:25px;
        }

        button{
            padding:12px 28px;
            border:none;
            border-radius:10px;
            background:#3b82f6;
            color:#fff;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#2563eb;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">⚠️</div>
    <h1>Maaf, Server Sedang Down</h1>
    <p>
        Server kami sedang mengalami gangguan atau dalam proses pemeliharaan.
        Silakan coba beberapa saat lagi.
    </p>

    <button onclick="location.reload()">
        Coba Lagi
    </button>
</div>

</body>
</html>
